name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Obsidian community plugins require main.js + manifest.json
      # attached to the GitHub release matching the manifest version.
      # The release stays a draft until the STT server binaries land
      # (stt-server.yml publishes it), so installers never see a
      # release without its download assets.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json versions.json --generate-notes --verify-tag --draft
